<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>简易密码管理器</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="header">
    <h1 id="popup-title"></h1>
  </div>
  <div class="controls">
    <div class="language-switcher">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <select id="language-select" title="Select Language">
        <option value="en">English</option>
        <option value="zh_CN">简体中文</option>
        <option value="zh_TW">繁體中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="hi">हिन्दी</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </div>
    <button id="export-button" class="control-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span class="button-text"></span>
    </button>
    <button id="settings-button" class="control-button icon-only" title="Settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>
  <div id="settings-panel" class="settings-panel" style="display:none;">
    <div class="settings-row">
      <label for="auto-lock-select" id="auto-lock-label">Auto-lock after</label>
      <select id="auto-lock-select">
        <option value="1">1 min</option>
        <option value="5">5 min</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
        <option value="0">Never</option>
      </select>
    </div>
    <div class="settings-row">
      <label for="autofill-site-toggle" id="autofill-site-label">Auto-show on this site</label>
      <input type="checkbox" id="autofill-site-toggle">
    </div>
    <div class="settings-row">
      <button id="lock-now-button" class="control-button secondary">Lock now</button>
    </div>
  </div>
  <div class="search-bar">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search-input" autocomplete="off">
  </div>
  <ul id="password-list">
    <!-- 密码项将由JS动态插入 -->
  </ul>
  <div class="master-password-section">
    <h2 id="master-password-title">主密码</h2>
    <p id="master-password-hint" class="mp-hint"></p>
    <div class="master-password-controls">
      <input type="password" id="master-password-input" placeholder="输入您的主密码">
      <button id="save-master-password" class="control-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        <span class="button-text">保存密钥</span>
      </button>
    </div>
    <div class="master-password-confirm-row">
      <input type="password" id="master-password-confirm" placeholder="再次输入">
    </div>
    <div id="master-password-strength" class="mp-strength" style="display:none;">
      <div class="strength-bar"><div class="strength-fill"></div></div>
      <span class="strength-label"></span>
    </div>
    <p id="master-password-error" class="mp-error"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
